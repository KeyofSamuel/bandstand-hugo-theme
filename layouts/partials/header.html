{{ "<!-- Navbar (sits on top) -->" | safeHTML }}

<div class="w3-top w3-white w3-card w3-hide-small">
  
	<div class="w3-row w3-padding-large">

		<div class="w3-half">
			<div class="w3-bar">
				<a class="w3-bar-item" href="{{ .Site.BaseURL }}">
					<img src="{{ .Site.Params.logo | absURL }}" alt="{{ .Site.Title }}">
				</a>
			</div>
		</div>
			  
		<div class="w3-half">
			{{ $currentPage := . }}
			{{ range .Site.Menus.main.ByWeight.Reverse }}
				<a class="w3-bar-item w3-button w3-hover-text-theme w3-hover-white w3-right" href="{{ .URL }}" title="{{ .Title }}">{{ .Name }}</a>
			{{ end }}
		  </div>
		
  		<div class="w3-half w3-hide-large w3-hide-medium">
			
				
		</div>
  
	</div>

</div>

<div class="w3-top w3-white w3-card w3-center w3-hide-large w3-hide-medium">

	<div class="w3-row">
		<div class="w3-col s6  w3-padding">
			<a class="w3-left" href="{{ .Site.BaseURL }}">
				<img src="{{ .Site.Params.logo | absURL }}" alt="{{ .Site.Title }}">
			</a>
		</div>

		<div class="w3-col s6 ">
			<div class="w3-dropdown-hover w3-right">
				<button class="w3-button w3-white"> <i class="fa-solid fa-bars"></i> </button>
					<div class="w3-dropdown-content w3-card-4" style="right:0">
			
						{{ $currentPage := . }}
						{{ range .Site.Menus.main.ByWeight }}
			
						<a class="w3-bar-item w3-button w3-hover-text-theme w3-hover-white" href="{{ .URL }}" title="{{ .Title }}">{{ .Name }}</a>
				
						{{ end }}
					</div>
			</div>
		</div>
	</div>

</div>
